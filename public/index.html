<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Letter Online</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <div id="app">
    <h1>Love Letter Online</h1>
    <div id="menu">
      <div id="create-room">
        <h2>Create Room</h2>
        <input type="text" id="player-name" placeholder="Your name" required>
        <h3>Card Counts</h3>
        <div id="card-counts"></div>
        <label>Tokens to Win: <input type="number" id="win-tokens" min="1" max="10" value="4"></label>
        <button id="create-btn">Create Room</button>
      </div>
      <div id="join-room">
        <h2>Join Room</h2>
        <input type="text" id="room-code" placeholder="Room code" maxlength="5">
        <input type="text" id="join-name" placeholder="Your name" required>
        <button id="join-btn">Join</button>
      </div>
    </div>

    <div id="game" style="display:none">
      <h2>Room: <span id="room-code-display"></span></h2>
      <button id="start-game" style="display:none">Start Game</button>
      <div id="players"></div>
      <div id="status"></div>
      <div id="hand"></div>
      <div id="last-played"></div>
      <div id="modal-overlay" style="display:none">
        <div id="modal-content"></div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
